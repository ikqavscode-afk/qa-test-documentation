name: Deploy checklist to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "data/**", "spritn-3-CarSh/bug-reports/**", "spritn-4-Metro/bug-reports/**", "scripts/sync_site_data.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: {group: pages, cancel-in-progress: true}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_site_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: d
        uses: actions/deploy-pages@v4
