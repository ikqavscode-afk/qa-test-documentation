name: Validate

# Проверяет данные, чистоту контента и актуальность сгенерированных файлов.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: JSON is valid
        run: |
          for f in data/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done
      - name: Content check (forbidden words, personal data)
        run: python3 scripts/check_content.py
      - name: Generated files are up to date
        run: |
          python3 scripts/build_checklists.py
          git diff --exit-code
